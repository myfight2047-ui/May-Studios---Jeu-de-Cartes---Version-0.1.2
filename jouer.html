<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .main-button {
            background-color: rgba(0, 100, 200, 0.8);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .main-button:hover {
            background-color: rgba(0, 120, 255, 0.9);
        }

        .side-buttons {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-buttons.left {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .side-buttons.right {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .side-button {
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .side-button:hover {
            background-color: rgba(80, 80, 80, 0.9);
        }
    </style>
</head>
<body>
    <div class="side-buttons left">
        <button class="side-button">Magasin</button>
        <button class="side-button">Paramètres</button>
    </div>

    <div class="menu-container">
        <h1>Bienvenue</h1>
        <button class="main-button">Jouer</button>
    </div>

    <div class="side-buttons right">
        <button class="side-button">Amis</button>
        <button class="side-button">Créateur de deck</button>
    </div>
</body>
</html>
