    <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .main-button {
            background-color: rgba(0, 100, 200, 0.8);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .main-button:hover {
            background-color: rgba(0, 120, 255, 0.9);
        }

        .side-buttons {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-buttons.left {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .side-buttons.right {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .side-button {
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .side-button:hover {
            background-color: rgba(80, 80, 80, 0.9);
        }

        button {
         position: relative;
         display: inline-block;
         cursor: pointer;
         outline: none;
         border: 0;
         vertical-align: middle;
         text-decoration: none;
         font-family: inherit;
         font-size: 15px;
        }

        button.learn-more {
         font-weight: 600;
         color: #382b22;
         text-transform: uppercase;
         padding: 1.25em 2em;
         background: #fff0f0;
         border: 2px solid #b18597;
         border-radius: 0.75em;
         -webkit-transform-style: preserve-3d;
         transform-style: preserve-3d;
         -webkit-transition: background 150ms cubic-bezier(0, 0, 0.58, 1), -webkit-transform 150ms cubic-bezier(0, 0, 0.58, 1);
         transition: transform 150ms cubic-bezier(0, 0, 0.58, 1), background 150ms cubic-bezier(0, 0, 0.58, 1), -webkit-transform 150ms cubic-bezier(0, 0, 0.58, 1);
        }

        button.learn-more::before {
         position: absolute;
         content: '';
         width: 100%;
         height: 100%;
         top: 0;
         left: 0;
         right: 0;
         bottom: 0;
 background: #f9c4d2;
 border-radius: inherit;
 -webkit-box-shadow: 0 0 0 2px #b18597, 0 0.625em 0 0 #ffe3e2;
 box-shadow: 0 0 0 2px #b18597, 0 0.625em 0 0 #ffe3e2;
 -webkit-transform: translate3d(0, 0.75em, -1em);
 transform: translate3d(0, 0.75em, -1em);
 transition: transform 150ms cubic-bezier(0, 0, 0.58, 1), box-shadow 150ms cubic-bezier(0, 0, 0.58, 1), -webkit-transform 150ms cubic-bezier(0, 0, 0.58, 1), -webkit-box-shadow 150ms cubic-bezier(0, 0, 0.58, 1);
}

button.learn-more:hover {
 background: #ffe9e9;
 -webkit-transform: translate(0, 0.25em);
 transform: translate(0, 0.25em);
}

button.learn-more:hover::before {
 -webkit-box-shadow: 0 0 0 2px #b18597, 0 0.5em 0 0 #ffe3e2;
 box-shadow: 0 0 0 2px #b18597, 0 0.5em 0 0 #ffe3e2;
 -webkit-transform: translate3d(0, 0.5em, -1em);
 transform: translate3d(0, 0.5em, -1em);
}

button.learn-more:active {
 background: #ffe9e9;
 -webkit-transform: translate(0em, 0.75em);
 transform: translate(0em, 0.75em);
}

button.learn-more:active::before {
 -webkit-box-shadow: 0 0 0 2px #b18597, 0 0 #ffe3e2;
 box-shadow: 0 0 0 2px #b18597, 0 0 #ffe3e2;
 -webkit-transform: translate3d(0, 0, -1em);
 transform: translate3d(0, 0, -1em);
}
    </style>
    
</head>
<body>
    <div class="side-buttons left">
        <button class="side-button">Magasin</button>
        <button class="side-button">Paramètres</button>
    </div>

    <div class="menu-container">
        <h1>Bienvenue</h1>
        <button class="learn-more">Jouer</button>
    </div>

    <div class="side-buttons right">
        <button class="side-button">Amis</button>
        <button class="side-button">Créateur de deck</button>
    </div>
</body>
</html>
