<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu de Cartes - Jouer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root {
  --bg: #0a0a0b;
  --bg2: #111113;
  --bg3: #18181b;
  --bg4: #222226;
  --border: #2a2a2f;
  --border2: #3a3a42;
  --text: #e8e6e0;
  --text2: #9a9890;
  --text3: #6a6865;
  --blue: #4a9eff;
  --violet: #8b7fff;
  --green: #34d68a;
  --red: #ff5a52;
  --orange: #ff9a3c;
  --pink: #ff6b9d;
}
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  margin: 0;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.container {
  display: grid;
  grid-template-columns: 200px 1fr 200px;
  grid-template-rows: 80px 1fr 80px;
  gap: 1rem;
  width: 100%;
  max-width: 1200px;
  height: 80vh;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
  background: var(--bg2);
}
.header-left, .header-right {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  background: var(--bg3);
  cursor: pointer;
  transition: background 0.15s;
}
.header-left:hover, .header-right:hover {
  background: var(--bg4);
}
.header-left a, .header-right a {
  color: var(--text2);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
}
.main-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  background: var(--bg3);
  cursor: pointer;
  transition: background 0.15s;
}
.main-center:hover {
  background: var(--bg4);
}
.play-button {
  background: var(--bg4);
  border: 0.5px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  padding: 1rem 2rem;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.play-button:hover {
  background: var(--blue);
  color: white;
}
.side-left, .side-right {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  background: var(--bg3);
  padding: 1rem;
}
.side-link {
  color: var(--text2);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 0.5rem;
  border-radius: 4px;
  transition: background 0.15s;
}
.side-link:hover {
  background: var(--bg4);
  color: var(--text);
}
</style>
</head>
<body>
  <div class="container">
    <!-- Header Left: Magasin -->
    <div class="header-left">
      <a href="magasin.html">🛒 Magasin</a>
    </div>
    <!-- Header Right: Paramètres -->
    <div class="header-right">
      <a href="parametres.html">⚙️ Paramètres</a>
    </div>

    <!-- Main Center: Bouton Jouer -->
    <div class="main-center">
      <button class="play-button">JOUER</button>
    </div>

    <!-- Side Left: Créateur de Deck -->
    <div class="side-left">
      <a href="createur-deck.html" class="side-link">🃏 Créateur de Deck</a>
    </div>

    <!-- Side Right: Amis et Recherche -->
    <div class="side-right">
      <a href="amis.html" class="side-link">👥 Amis</a>
      <a href="amis.html" class="side-link">🔍 Recherche</a>
    </div>
  </div>
</body>
</html>
