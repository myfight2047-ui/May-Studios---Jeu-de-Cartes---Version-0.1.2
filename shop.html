<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Boutique</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f14;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding:40px;
}

.card{
    background:#1b1b26;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.buy{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#3a3a55;
    color:white;
    cursor:pointer;
}
</style>
</head>
<body>

<h1 style="text-align:center;">Boutique</h1>

<div class="grid">
    <div class="card">Carte Dragon<br><button class="buy">Acheter</button></div>
    <div class="card">Carte Mage<br><button class="buy">Acheter</button></div>
    <div class="card">Carte Ninja<br><button class="buy">Acheter</button></div>
</div>

</body>
</html>
