<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Card Game UI</title>
<style>
body {
    margin: 0;
    background: #0f0f14;
    font-family: Arial;
    overflow: hidden;
}

/* zone générale */
.game {
    position: relative;
    width: 100vw;
    height: 100vh;
}

/* carte style */
.card {
    width: 90px;
    height: 130px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    position: absolute;
    transition: transform 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* cartes active */
.top-active {
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
}

.bottom-active {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}

/* main du joueur */
.hand {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: -20px;
}

.hand .card {
    position: relative;
    margin-left: -30px;
    cursor: pointer;
}

.hand .card:hover {
    transform: translateY(-25px) scale(1.05);
    z-index: 10;
}

/* deck à droite */
.deck {
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
}

/* pile de défausse */
.discard-top {
    top: 20px;
    right: 30px;
}

.discard-bottom {
    bottom: 20px;
    right: 30px;
}

/* carte dos (deck / discard) */
.back {
    background: linear-gradient(45deg, #444, #222);
    color: white;
}

/* compteur */
.counter {
    position: absolute;
    top: -10px;
    right: -10px;
    background: red;
    color: white;
    font-size: 12px;
    padding: 3px 6px;
    border-radius: 50%;
}
</style>
</head>
<body>

<div class="game">

    <!-- cartes actives -->
    <div class="card top-active">Adversaire</div>
    <div class="card bottom-active">Toi</div>

    <!-- main joueur -->
    <div class="hand">
        <div class="card">A</div>
        <div class="card">K</div>
        <div class="card">zQ</div>
        <div class="card">J</div>
    </div>

    <!-- deck -->
    <div class="card deck back">Deck</div>

    <!-- défausse adversaire -->
    <div class="card discard-top back">
        <div class="counter">3</div>
    </div>

    <!-- défausse joueur -->
    <div class="card discard-bottom back">
        <div class="counter">5</div>
    </div>

</div>

</body>
</html>
