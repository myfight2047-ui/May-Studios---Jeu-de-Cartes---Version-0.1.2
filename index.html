<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Card Game - Home</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(135deg,#0f0f14,#1b1b26);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    text-align:center;
    background:rgba(255,255,255,0.05);
    padding:50px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    width:450px;
}

h1{
    font-size:48px;
    margin-bottom:10px;
}

.subtitle{
    opacity:0.7;
    margin-bottom:40px;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
}

button{
    padding:18px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    background:#2a2a3d;
    color:white;
}

button:hover{
    transform:scale(1.03);
    background:#3a3a55;
}
</style>
</head>
<body>

<div class="container">
    <h1>Card Game</h1>
    <div class="subtitle">Menu principal</div>

    <div class="buttons">
        <button onclick="location.href='game.html'">Jouer</button>
        <button onclick="location.href='settings.html'">Paramètres</button>
        <button>Quitter</button>
    </div>
</div>

</body>
</html>
