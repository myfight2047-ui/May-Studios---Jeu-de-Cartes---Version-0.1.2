<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Card Game UI</title>

<style>
body {
    margin: 0;
    background: #0f0f14;
    font-family: Arial;
    overflow: hidden;
}

.game {
    position: relative;
    width: 100vw;
    height: 100vh;
}

/* carte de base */
.card {
    width: 90px;
    height: 130px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* active cartes */
.top-active {
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
}

.bottom-active {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}

/* main joueur */
.hand {
    position: absolute;
    bottom: 20px;
    left: 20px;
    display: flex;
}

.hand .card {
    position: relative;
    margin-left: -30px;
    cursor: pointer;
    transition: transform 0.2s;
}

.hand .card:hover {
    transform: translateY(-25px) scale(1.05);
    z-index: 10;
}

/* deck */
.deck {
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
}

/* cartes dos */
.back {
    background: linear-gradient(45deg, #444, #222);
    color: white;
}

/* défausses */
.discard-top {
    top: 20px;
    right: 160px;
    z-index: 1;
}

.discard-bottom {
    bottom: 20px;
    right: 160px;
    z-index: 1;
}

/* compteur centré */
.counter {
    font-size: 20px;
    color: white;
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* chat */
.chat {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 220px;
    height: 300px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    padding: 10px;
    color: white;
    font-size: 14px;
    overflow: hidden;
}

.chat input {
    width: 100%;
    margin-top: 10px;
    padding: 5px;
    border: none;
    border-radius: 5px;
}
</style>

</head>
<body>

<div class="game">

    <!-- chat -->
    <div class="chat">
        <div>💬 Chat</div>
        <div style="margin-top:10px; opacity:0.7;">
            joueur1: bonjour<br>
            joueur2: salut
        </div>
        <input placeholder="écrire...">
    </div>

    <!-- cartes actives -->
    <div class="card top-active">ADV</div>
    <div class="card bottom-active">TOI</div>

    <!-- main -->
    <div class="hand">
        <div class="card">A</div>
        <div class="card">K</div>
        <div class="card">Q</div>
        <div class="card">J</div>
    </div>

    <!-- deck -->
    <div class="card deck back">Deck</div>

    <!-- défausse adversaire -->
    <div class="card discard-top back">
        <div class="counter">3</div>
    </div>

    <!-- défausse joueur -->
    <div class="card discard-bottom back">
        <div class="counter">5</div>
    </div>

</div>

</body>
</html>
