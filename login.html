<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body{
    margin:0;
    background:#0f0f14;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#1b1b26;
    padding:40px;
    border-radius:20px;
    width:350px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#2a2a3d;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#3a3a55;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#50507a;
}
</style>
</head>
<body>

<div class="box">
    <h2>Profil joueur</h2>

    <input placeholder="Pseudo">
    <input placeholder="Mot de passe" type="password">

    <button onclick="location.href='index.html'">Connexion</button>
</div>

</body>
</html>
