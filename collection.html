<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Collection</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f14;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    padding:30px;
}

.card{
    height:120px;
    background:#2a2a3d;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>
</head>
<body>

<h1 style="text-align:center;">Collection</h1>

<div class="grid">
    <div class="card">Dragon</div>
    <div class="card">Mage</div>
    <div class="card">Ninja</div>
    <div class="card">Knight</div>
</div>

</body>
</html>
