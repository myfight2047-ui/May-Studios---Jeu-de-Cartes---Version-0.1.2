<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Deck Builder</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f14;
    color:white;
}

.container{
    display:flex;
    gap:20px;
    padding:20px;
}

.box{
    flex:1;
    background:#1b1b26;
    padding:20px;
    border-radius:15px;
    min-height:80vh;
}

.card{
    background:#2a2a3d;
    padding:10px;
    margin:10px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1 style="text-align:center;">Deck Builder</h1>

<div class="container">

    <div class="box">
        <h3>Collection</h3>
        <div class="card">Dragon</div>
        <div class="card">Mage</div>
        <div class="card">Ninja</div>
    </div>

    <div class="box">
        <h3>Ton Deck</h3>
    </div>

</div>

</body>
</html>
