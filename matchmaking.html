<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Matchmaking</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f0f14;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    text-align:center;
    background:#1b1b26;
    padding:50px;
    border-radius:20px;
}

.loader{
    width:60px;
    height:60px;
    border:5px solid #333;
    border-top:5px solid white;
    border-radius:50%;
    margin:20px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}
</style>
</head>
<body>

<div class="box">
    <h2>Recherche d’adversaire...</h2>
    <div class="loader"></div>
    <p>En attente de joueur</p>
</div>

</body>
</html>
